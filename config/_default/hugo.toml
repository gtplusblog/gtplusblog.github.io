# =====================================================================================
# 站点主配置 —— Hugo 0.154.2 + FixIt 0.4.0-beta
# 采用 FixIt 推荐的 alternate config 结构：
#   config/_default/hugo.toml    站点与环境相关配置（本文件）
#   config/_default/params.toml  主题参数
#   config/_default/menus.toml   导航菜单
#   config/_default/markup.toml  Markdown / 代码高亮配置
# =====================================================================================

# 网站标题
title = "GUTUN的梦"
# Hostname (and path) to the root
baseURL = "https://gtplusblog.github.io/"
# 使用的主题
theme = ["FixIt"]
# 默认内容语言
defaultContentLanguage = "zh-cn"
languageCode = "zh-CN"
languageName = "简体中文"
# 是否包括中日韩文字
hasCJKLanguage = true
# 未显式指定条数的列表页默认每页文章数
pagerSize = 12
# 版权所有者：用于 seo schema 与页脚版权行
copyright = "GUTUN"
# 生成 robots.txt
enableRobotsTXT = true
# 用 git 提交时间作为页面的「更新于」日期
enableGitInfo = true
# 允许 emoji 短代码
enableEmoji = true

# -------------------------------------------------------------------------------------
# 输出格式
# 已关闭 RSS（3.9）、lunr 时代的 index.json 与 baidu_urls.txt（4.4）；
# 保留 search，供 FixIt 的 fuse 搜索读取 /search.json（2.6）。
# -------------------------------------------------------------------------------------
[outputs]
  home = ["html", "search"]
  page = ["html"]
  section = ["html"]
  taxonomy = ["html"]
  term = ["html"]

# -------------------------------------------------------------------------------------
# 分类法（3.10.2：移除从未使用的 collections）
# -------------------------------------------------------------------------------------
[taxonomies]
  category = "categories"
  tag = "tags"

# -------------------------------------------------------------------------------------
# 固定链接：URL 取自 front matter 的 slug
# -------------------------------------------------------------------------------------
[permalinks]
  posts = "/posts/:slug"

# -------------------------------------------------------------------------------------
# 网站地图
# -------------------------------------------------------------------------------------
[sitemap]
  changefreq = "daily"
  filename = "sitemap.xml"
  priority = 0.5

# -------------------------------------------------------------------------------------
# 隐私
# -------------------------------------------------------------------------------------
[privacy]
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

# -------------------------------------------------------------------------------------
# 模块：Hugo 版本下限与主题要求一致
# -------------------------------------------------------------------------------------
[module]
  [module.hugoVersion]
    extended = true
    min = "0.147.7"